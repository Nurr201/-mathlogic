<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Урок — MathLogic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/editorial.css">
</head>
<body class="v7-app v7-lesson axis-lesson-page">
  <header class="lesson-topbar">
    <a class="axis-back" href="dashboard.html" data-i18n="lesson.back">К маршруту</a>
    <div class="lesson-top-context mono" id="lesson-top-context">ALG / УРОК</div>
    <div class="lesson-top-actions">
      <span class="v7-pill"><b id="lesson-length">0 шагов</b></span>
      <button class="axis-icon-button" id="lesson-theme" type="button" aria-label="Переключить тему">◐</button>
    </div>
  </header>

  <div class="lesson-layout">
    <aside class="lesson-route-rail" aria-label="Этапы урока">
      <a class="axis-brand" href="index.html" aria-label="MathLogic">
        <span class="axis-brand-mark"><i></i><i></i></span>
        <span>MathLogic</span>
      </a>
      <div class="axis-eyebrow" data-i18n="lesson.route">Маршрут</div>
      <nav class="lesson-route" id="lesson-route"></nav>
    </aside>

    <main class="lesson-column" id="lesson-column">
      <div class="lesson-loading" id="lesson-loading" aria-live="polite">
        <span class="axis-skeleton axis-skeleton-kicker"></span>
        <span class="axis-skeleton axis-skeleton-title"></span>
        <span class="axis-skeleton axis-skeleton-line"></span>
      </div>

      <section class="lesson-error" id="lesson-error" hidden role="alert">
        <span class="lesson-error-mark" aria-hidden="true">!</span>
        <h1 id="lesson-error-title">Урок не найден</h1>
        <p id="lesson-error-text">Проверьте ссылку или вернитесь к маршруту.</p>
        <a class="axis-button axis-button-ink" href="dashboard.html">Вернуться на Dashboard</a>
      </section>

      <div id="lesson-active" hidden>
        <header class="lesson-heading">
          <div class="axis-eyebrow mono" id="lesson-breadcrumb">АЛГЕБРА / УРОК</div>
          <h1 id="lesson-title">Урок</h1>
          <p id="lesson-description"></p>
          <div class="lesson-meta mono">
            <span id="lesson-duration">— мин</span>
            <span id="lesson-step-meta">0 / 0 шагов</span>
            <span class="lesson-mode-badge" id="lesson-mode" hidden></span>
          </div>
        </header>
        <div class="lesson-engine-content" id="main-content" aria-live="polite"></div>
      </div>
    </main>

    <aside class="lesson-progress-rail" id="lesson-progress-rail" aria-label="Прогресс урока">
      <div class="axis-eyebrow" data-i18n="lesson.progress">Прогресс</div>
      <div class="lesson-progress-value mono" id="lesson-progress-value">0%</div>
      <div class="axis-track"><span id="lesson-progress-fill"></span></div>
      <p class="lesson-progress-copy" id="lesson-progress-copy">0 из 0 шагов</p>
      <div class="lesson-remaining">
        <h2 data-i18n="lesson.remaining">Что осталось</h2>
        <div id="lesson-checklist"></div>
      </div>
      <div class="lesson-tip">
        <span class="axis-eyebrow" data-i18n="lesson.tip">Подсказка</span>
        <p data-i18n="lesson.tipText">Можно выйти: текущий шаг и ответы сохраняются автоматически.</p>
      </div>
    </aside>
  </div>

  <div class="axis-toast" id="lesson-toast" role="status" aria-live="polite"></div>

  <script src="data/curriculum.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/events.js"></script>
  <script src="js/learning.js"></script>
  <script src="js/ui.js"></script>
  <script src="data/lesson-assets.js"></script>
  <script src="js/lesson-loader.js"></script>
</body>
</html>
