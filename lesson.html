<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Виет теоремасы — math·logic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          blue: { 50: '#EEF2FF', 100: '#E0E7FF', 200: '#C7D2FE', 300: '#A5B4FC', 400: '#818CF8', 500: '#6366F1', 600: '#4F46E5', 700: '#4338CA', 800: '#3730A3', 900: '#312E81' },
          indigo: { 50: '#EEF2FF', 100: '#E0E7FF', 200: '#C7D2FE', 300: '#A5B4FC', 400: '#818CF8', 500: '#6366F1', 600: '#4F46E5', 700: '#4338CA' },
          purple: { 50: '#F5F3FF', 100: '#EDE9FE', 200: '#DDD6FE', 300: '#C4B5FD', 400: '#A78BFA', 500: '#8B5CF6', 600: '#7C3AED', 700: '#6D28D9' },
          emerald: { 50: '#F0FDF4', 100: '#D1FAE5', 200: '#A7F3D0', 300: '#6EE7B7', 400: '#34D399', 500: '#10B981', 600: '#059669' },
        },
        fontFamily: { head: ['Rubik', 'sans-serif'] },
        borderRadius: { '2xl': '16px', '3xl': '20px' },
      }
    }
  }
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      overflow: hidden;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .scroll-area::-webkit-scrollbar { width: 8px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    .scroll-area::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body class="h-screen w-screen flex relative page-enter">

  <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none opacity-60">
    <div class="absolute top-[-10%] left-[-5%] w-[500px] h-[500px] bg-blue-200/50 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[600px] h-[600px] bg-purple-100/60 rounded-full blur-[120px]"></div>
    <div class="absolute top-[30%] left-[50%] w-[400px] h-[400px] bg-amber-50/80 rounded-full blur-[90px]"></div>
  </div>

  <!-- ================= СОЛ ЖАҚ: ШКАЛА ПУТИ ================= -->
  <aside class="w-80 bg-white/80 backdrop-blur-md border-r border-slate-200/60 flex flex-col h-full z-10 shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
    <div class="p-7 pb-5 border-b border-slate-100">
      <a href="dashboard.html" class="text-xs font-bold text-slate-400 hover:text-blue-600 transition-colors flex items-center gap-1.5 mb-3">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Бақылау тақтасы
      </a>
      <span class="text-[11px] font-extrabold uppercase tracking-widest text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">Алгебра • 8-9 сынып</span>
      <h2 class="text-2xl font-extrabold text-slate-900 mt-3 tracking-tight">Виет теоремасы</h2>
      <p class="text-sm text-slate-500 mt-1 font-medium">Қадамдық оқу модулі</p>
    </div>

    <div class="flex-1 overflow-y-auto p-5 space-y-2 scroll-area" id="sidebar-steps">
      <!-- Engine рендерит через afterRender hook -->
    </div>
  </aside>

  <!-- ================= ОҢ ЖАҚ: КОНТЕНТ ================= -->
  <main class="flex-1 h-full overflow-y-auto scroll-area relative" id="main-content">
    <!-- LessonEngine рендерит блоки сюда -->
  </main>

  <script src="js/storage.js"></script>
  <script src="js/events.js"></script>
  <script src="js/xp.js"></script>
  <script src="js/data.js"></script>
  <script src="js/learning.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>

  <!-- Lesson Engine v2 -->
  <script src="js/lesson-engine/state.js"></script>
  <script src="js/lesson-engine/hooks.js"></script>
  <script src="js/lesson-engine/storage.js"></script>
  <script src="js/lesson-engine/debug.js"></script>
  <script src="js/lesson-engine/serializer.js"></script>
  <script src="js/lesson-engine/core.js"></script>
  <script src="js/lesson-engine.js"></script>
  <script src="js/lesson-blocks/helpers.js"></script>
  <script src="js/lesson-blocks/registry.js"></script>
  <script src="js/lesson-blocks/renderers.js"></script>
  <script src="js/lesson-blocks.js"></script>
  <script src="data/lesson-schema.js"></script>
  <script src="js/dev.js"></script>

  <script>
  (function() {
    var LESSON_ID = 'algebra_3';

    function scrollSidebarToCurrent() {
      var container = document.getElementById('sidebar-steps');
      if (!container) return;
      var active = container.querySelector('.step-active');
      if (!active) return;
      var ch = container.clientHeight;
      var ah = active.offsetHeight;
      container.scrollTop = active.offsetTop - (ch / 2) + (ah / 2);
    }

    function renderBlocksSidebar(blocks, currentIndex, completed) {
      var container = document.getElementById('sidebar-steps');
      if (!container) return;
      container.innerHTML = '';
      blocks.forEach(function(block, i) {
        var stateClass = 'step-pending';
        if (completed.indexOf(i) > -1) stateClass = 'step-completed';
        if (i === currentIndex) stateClass = 'step-active';

        var icon;
        if (completed.indexOf(i) > -1) {
          icon = '<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
        } else {
          icon = '<span class="text-sm font-extrabold font-mono">' + (i + 1) + '</span>';
        }

        var blockIcon = '';
        if (block.icon) blockIcon = block.icon + ' ';
        var label = block.title || block.type.charAt(0).toUpperCase() + block.type.slice(1);

        container.innerHTML += '<div class="flex items-center gap-3.5 ' + stateClass + ' p-2 rounded-2xl transition-all cursor-pointer hover:bg-slate-100">' +
          '<div class="step-box w-10 h-10 rounded-xl flex items-center justify-center shrink-0">' + icon + '</div>' +
          '<div class="flex flex-col">' +
            '<span class="step-text text-[0.95rem] leading-tight font-semibold transition-colors">' + blockIcon + label + '</span>' +
            '<span class="text-xs opacity-80 mt-0.5 text-slate-500">' + (block.subtitle || '') + '</span>' +
          '</div></div>';
      });
    }

    function loadLesson() {
      var config = JSON.parse(JSON.stringify(LESSON_SCHEMA.example));
      config.id = LESSON_ID;

      var mainEl = document.getElementById('main-content');

      var isRepeat = false;
      if (typeof Learning !== 'undefined' && Learning.getLessonState) {
        isRepeat = Learning.getLessonState(LESSON_ID) === 'completed';
      }

      var correctCount = 0;
      var questionCount = 0;

      if (isRepeat) {
        var banner = document.createElement('div');
        banner.id = 'repeat-banner';
        banner.className = 'fixed top-0 left-0 right-0 z-50 bg-amber-50 border-b-2 border-amber-200 px-4 py-3 text-center shadow-md';
        banner.innerHTML = '<p class="text-sm font-bold text-amber-800">\uD83D\uDCD6 Режим повторения. Повторное прохождение не влияет на прогресс и не приносит XP.</p>';
        document.body.prepend(banner);
        document.querySelector('aside').style.marginTop = '48px';
        mainEl.style.marginTop = '48px';
      }

      LessonEngine.on('beforeLesson', function() {
        correctCount = 0;
        questionCount = 0;
      });

      LessonEngine.on('afterComplete', function(data) {
        if (data.result && data.result.correct !== undefined) {
          if (data.result.correct) correctCount++;
          questionCount++;
        }
      });

      LessonEngine.on('afterRender', function(data) {
        var state = LessonEngine.getState();
        renderBlocksSidebar(
          config.blocks,
          data.blockIndex || state.currentIndex,
          state.completedBlocks || []
        );
        scrollSidebarToCurrent();
      });

      LessonEngine.analytics.on('onLessonFinish', function(data) {
        var st = LessonEngine.getState();
        if (st.repeatMode) return;

        var totalQuestions = questionCount > 0 ? questionCount : data.totalBlocks;
        var scorePct = totalQuestions > 0 ? Math.round((correctCount / totalQuestions) * 100) : 0;
        var xpEarned = typeof QuizEngine !== 'undefined'
          ? QuizEngine.calcXP(correctCount)
          : 30 + correctCount * 10;
        var grade = typeof QuizEngine !== 'undefined'
          ? QuizEngine.calcGrade(scorePct)
          : scorePct >= 90 ? 'S' : scorePct >= 80 ? 'A' : scorePct >= 60 ? 'B' : 'C';

        if (typeof Learning !== 'undefined' && Learning.completeLesson) {
          Learning.completeLesson(LESSON_ID, {
            score: scorePct,
            correct: correctCount,
            total: totalQuestions,
            attempts: (data.mistakes || 0) + correctCount,
            time: data.timeSpent || 0,
            xpEarned: xpEarned,
            grade: grade,
          });
        }
      });

      LessonEngine.load(config, mainEl);

      if (typeof ANIME !== 'undefined' && ANIME.initPageTransitions) {
        ANIME.initPageTransitions();
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      loadLesson();
    } else {
      document.addEventListener('DOMContentLoaded', loadLesson);
    }
  })();
  </script>
</body>
</html>
