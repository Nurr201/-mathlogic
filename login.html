<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кіру — math·logic</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<style>
  body { font-family: 'Golos Text', sans-serif; background: #F8FAFC; color: #0F172A; }
  .fd { font-family: 'Rubik', sans-serif; }
</style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- ШАПКА -->
  <header class="w-full bg-white border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="fd font-extrabold text-2xl text-blue-700 tracking-tight">
        math<span class="text-sky-500">·</span>logic
      </a>
      <a href="onboarding.html" class="bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-md transition-all">
        Бастау
      </a>
    </div>
  </header>

  <!-- ФОРМА ВХОДА -->
  <main class="flex-grow flex items-center justify-center p-4 my-6">
    <div class="w-full max-w-md bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-slate-100">
      <h2 class="fd text-2xl font-extrabold text-slate-800 mb-2 text-center">Платформаға кіру</h2>
      <p class="text-sm text-slate-500 mb-6 text-center">Электронды почта мен пароліңді енгіз</p>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 fd mb-1">Email</label>
          <input type="email" required placeholder="luke@example.com" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-700 rounded-xl px-4 py-3 text-sm outline-none transition-all">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 fd mb-1">Құпия сөз</label>
          <input type="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-700 rounded-xl px-4 py-3 text-sm outline-none transition-all">
        </div>

        <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white fd font-bold py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition-all text-sm mt-2">
          Кіру →
        </button>
      </form>

      <p class="text-xs text-slate-400 text-center mt-6">
        Аккаунтың жоқ па? <a href="onboarding.html" class="text-blue-700 font-bold hover:underline">Тіркелу (Бастау)</a>
      </p>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const emailInput = e.target.querySelector('input[type="email"]');
      const userEmail = emailInput ? emailInput.value : 'user@example.com';
      ML.setUser({ email: userEmail, loggedIn: true });
      UI.showToast('Кіру орындалды!', 'success');
      setTimeout(function() { window.location.href = "dashboard.html"; }, 500);
    }
  </script>
</body>
</html>
