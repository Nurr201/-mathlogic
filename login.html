<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кіру — math·logic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F8FAFC; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow-x: hidden; }
    .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .ambient .blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; }
    .ambient .blob-1 { width: 500px; height: 500px; background: #EEF2FF; top: -15%; left: -10%; }
    .ambient .blob-2 { width: 400px; height: 400px; background: #F0FDF4; bottom: -10%; right: -5%; }
    .ambient .blob-3 { width: 350px; height: 350px; background: #F5F3FF; top: 40%; left: 50%; }
    .float-math { position: fixed; pointer-events: none; z-index: 0; font-family: 'JetBrains Mono', monospace; font-weight: 700; opacity: 0.08; font-size: 80px; color: #4F46E5; }
    .fm-1 { top: 8%; left: 5%; animation: floatA 8s ease-in-out infinite; }
    .fm-2 { bottom: 12%; right: 8%; animation: floatA 10s ease-in-out 2s infinite; font-size: 100px; color: #059669; }
    .fm-3 { top: 50%; left: 3%; animation: floatA 9s ease-in-out 4s infinite; font-size: 60px; color: #7C3AED; }
    @keyframes floatA { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-20px) rotate(3deg)} }

    .auth-wrap { position: relative; z-index: 1; display: flex; max-width: 1000px; width: 100%; min-height: 620px; border-radius: 24px; background: white; box-shadow: 0 30px 100px rgba(15,23,42,0.08), 0 10px 30px rgba(15,23,42,0.03); overflow: hidden; }
    .auth-left { flex: 1; padding: 48px 44px; display: flex; flex-direction: column; }
    .auth-right { width: 440px; background: linear-gradient(160deg, #4F46E5 0%, #4338CA 50%, #6D28D9 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 44px 36px; color: white; position: relative; overflow: hidden; }
    .auth-right::before { content: ''; position: absolute; top: -40%; right: -30%; width: 500px; height: 500px; border-radius: 50%; background: rgba(255,255,255,0.05); }
    .auth-right::after { content: ''; position: absolute; bottom: -30%; left: -20%; width: 400px; height: 400px; border-radius: 50%; background: rgba(255,255,255,0.04); }
    .auth-right-content { position: relative; z-index: 1; text-align: center; }
    .auth-logo-badge { width: 64px; height: 64px; border-radius: 16px; background: rgba(255,255,255,0.12); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-family: 'Rubik', sans-serif; font-size: 28px; font-weight: 800; color: white; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
    .auth-right-title { font-family: 'Rubik', sans-serif; font-size: 24px; font-weight: 800; line-height: 1.3; margin-bottom: 10px; }
    .auth-right-desc { font-size: 14px; opacity: 0.7; line-height: 1.7; max-width: 280px; margin: 0 auto; }
    .auth-right-formulas { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .auth-right-formulas span { padding: 10px 18px; border-radius: 12px; background: rgba(255,255,255,0.07); font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.05); }

    .auth-logo-row { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 36px; }
    .auth-logo-icon { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #4F46E5, #7C3AED); display: flex; align-items: center; justify-content: center; color: white; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 18px; box-shadow: 0 4px 12px rgba(79,70,229,0.2); }
    .auth-logo-text { font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 20px; color: #0F172A; letter-spacing: -0.03em; }
    .auth-logo-text span { color: #4F46E5; }

    .auth-title { font-family: 'Rubik', sans-serif; font-size: 30px; font-weight: 800; color: #0F172A; letter-spacing: -0.02em; margin-bottom: 6px; }
    .auth-subtitle { font-size: 15px; color: #64748B; margin-bottom: 36px; font-weight: 500; }
    .auth-form { display: flex; flex-direction: column; gap: 20px; }
    .auth-field { display: flex; flex-direction: column; gap: 6px; }
    .auth-field label { font-family: 'Rubik', sans-serif; font-size: 12px; font-weight: 700; color: #475569; letter-spacing: 0.02em; text-transform: uppercase; }
    .auth-field input { padding: 15px 18px; border-radius: 12px; border: 1.5px solid #E2E8F0; background: #F8FAFC; font-family: 'Inter', sans-serif; font-size: 15px; outline: none; transition: all 0.25s ease; color: #0F172A; }
    .auth-field input::placeholder { color: #94A3B8; }
    .auth-field input:focus { border-color: #4F46E5; background: white; box-shadow: 0 0 0 4px rgba(79,70,229,0.08); }
    .auth-btn { padding: 17px; border-radius: 12px; border: none; background: linear-gradient(135deg, #4F46E5, #7C3AED); color: white; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 16px; cursor: pointer; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); box-shadow: 0 6px 20px rgba(79,70,229,0.25); margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(79,70,229,0.35); }
    .auth-btn:active { transform: translateY(0); }
    .auth-switch { text-align: center; margin-top: 28px; font-size: 14px; color: #64748B; font-weight: 500; }
    .auth-switch a { color: #4F46E5; font-weight: 700; text-decoration: none; transition: opacity 0.2s; }
    .auth-switch a:hover { opacity: 0.7; }
    @media (max-width: 820px) {
      .auth-right { display: none; }
      .auth-left { padding: 36px 28px; }
      .auth-wrap { min-height: auto; }
    }
    @media (max-width: 480px) {
      .auth-left { padding: 28px 20px; }
      .auth-title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="float-math fm-1">Σ</div>
  <div class="float-math fm-2">∫</div>
  <div class="float-math fm-3">∞</div>

  <div class="auth-wrap animate-scale-in">
    <div class="auth-left">
      <a href="index.html" class="auth-logo-row">
        <div class="auth-logo-icon">∑</div>
        <span class="auth-logo-text">math<span>·</span>logic</span>
      </a>
      <h1 class="auth-title">Платформаға кіру</h1>
      <p class="auth-subtitle">Электронды почта мен пароліңді енгіз</p>
      <form class="auth-form" onsubmit="handleLogin(event)">
        <div class="auth-field">
          <label>Электронды почта</label>
          <input type="email" id="login-email" required placeholder="luke@example.com">
        </div>
        <div class="auth-field">
          <label>Құпия сөз</label>
          <input type="password" id="login-pass" required placeholder="••••••••">
        </div>
        <button type="submit" class="auth-btn">Кіру <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      </form>
      <p class="auth-switch">Аккаунтың жоқ па? <a href="register.html">Тіркелу</a></p>
    </div>
    <div class="auth-right">
      <div class="auth-right-content">
        <div class="auth-logo-badge">∑</div>
        <div class="auth-right-title">Математиканы<br>түсініп үйрен</div>
        <p class="auth-right-desc">Қазақ тіліндегі интерактивті сабақтар, тесттер және тапсырмалар</p>
        <div class="auth-right-formulas">
          <span>x² + y² = r²</span>
          <span>3x + 7 = 22</span>
          <span>a² + b² = c²</span>
          <span>sin²α + cos²α = 1</span>
          <span>logₐ(xy) = logₐx + logₐy</span>
        </div>
      </div>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/events.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/app.js"></script>
  <script>
    ANIME?.initPageTransitions?.();
    function handleLogin(e) {
      e.preventDefault();
      ML.setUser({ email: document.getElementById('login-email').value, loggedIn: true });
      UI?.showToast?.('Кіру орындалды!', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 400);
    }
  </script>
</body>
</html>
